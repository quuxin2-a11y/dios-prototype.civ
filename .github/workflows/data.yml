name: Data feed
# Every 20 minutes: load every public camera network and worldwide data layer once, here, and
# publish the result on the "data" branch, so each phone gets everything in one download.
# See harvest.py and src-41-feed.js.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-feed
  cancel-in-progress: false
jobs:
  harvest:
    name: Harvest and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the headless browser
        run: |
          python3 -m pip install --quiet playwright==1.63.0
          python3 -m playwright install --with-deps chromium
      - name: Harvest
        run: python3 harvest.py out
      - name: Publish to the data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "ojos-data"
          git config user.email "ojos-data@users.noreply.github.com"
          git add cams.json layers.json meta.json
          git commit -q -m "Data feed $(date -u +%Y-%m-%dT%H:%MZ)"
          # One commit, replaced each run, so the branch never grows.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
